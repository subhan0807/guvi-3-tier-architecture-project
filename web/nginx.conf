server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Forward API requests to the private/internal Application Load Balancer.
    # Set the actual internal ALB DNS name in your deployed environment.
    location /api/ {
        proxy_pass http://YOUR_INTERNAL_ALB_DNS:5000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
